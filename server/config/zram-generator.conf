# vader has 466MB RAM and previously had NO swap at all, so nothing was
# evictable and any spike OOMed instantly - on 2026-08-10 a routine ffmpeg
# capture coinciding with a node GC peak killed the weather server.
# zram gives compressed in-RAM swap with no eMMC/SD wear (root is on mmcblk1).
[zram0]
zram-size = ram / 2
compression-algorithm = zstd
swap-priority = 100
