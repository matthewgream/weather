/etc/systemd/system/connmon.service.d/50-memory.conf
# vader has 466MB RAM. Without ceilings a single runaway takes the whole box
# down and the kernel picks the victim by heuristic - on 2026-08-10 it chose
# the weather server (382MB anon + 78MB tmpfs, zero swap). MemoryHigh throttles
# and reclaims first; MemoryMax is the hard stop.
[Service]
MemoryAccounting=yes
MemoryHigh=48M
MemoryMax=64M

